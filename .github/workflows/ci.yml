name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build # fails on dead links

  samples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [BookShelf, TodoApi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build samples/${{ matrix.sample }}.slnx
      - run: dotnet test samples/${{ matrix.sample }}.slnx --no-build
